name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.17.5
      - run: ruff check .
      - run: ruff format --check .

  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run unit tests (server smoke tests are skipped without torch)
        run: pytest -m "not server"

  server-smoke:
    name: Build & server smoke tests (CPU)
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1 ffmpeg
      - name: Install CPU PyTorch and the full runtime stack
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          # requirements.txt pins ROCm wheels; install everything else from it.
          grep -vE '^(--extra-index-url|torch|torchaudio)' requirements.txt > /tmp/requirements-cpu.txt
          pip install -r /tmp/requirements-cpu.txt -r requirements-dev.txt
      - name: Byte-compile sources
        run: python -m compileall -q src scripts
      - name: Server smoke tests
        run: pytest -m server -v
