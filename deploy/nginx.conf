events {}

http {
  resolver 127.0.0.11 valid=30s ipv6=off;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    server_name _;
    # Voice uploads (/voice-turn, /detect-lang) exceed nginx's 1 MB default.
    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      set $app_upstream app:8080;
      proxy_pass http://$app_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600;
      proxy_send_timeout 3600;
      proxy_buffering off;
      # CORS is handled by the Flask app (CORS_ORIGINS); adding headers here
      # as well would duplicate Access-Control-Allow-Origin and break browsers.
    }
  }

  # TLS server block (enable once certs are in place)
  # server {
