[project]
name = "voice-ai-model"
version = "0.1.0"
description = "Low-cost, self-hosted multilingual speech-to-speech voice agent for Indic languages with acoustic distress detection."
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.ipynb", "Piper Tamil", "paper", "results", "gpu_wav_samples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = [
    "E501",   # long strings/prompts are common; the formatter handles code width
    "B008",
    "SIM105", # explicit try/except/pass is clearer in hot audio paths
    "SIM108",
    "UP006",  # keep typing.Dict/List annotations in legacy modules
    "UP035",
    "UP045",
    "UP007",
]

[tool.ruff.lint.per-file-ignores]
"src/realtime/signaling_server.py" = ["E402"]  # staged heavy imports after setup
"scripts/**" = ["E402"]
"src/**/train*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "server: smoke tests that import the full Flask server (needs torch/transformers/aiortc)",
]
